      timeout: 10s
      retries: 5
      start_period: 30s
      interval: 30s

  # Admin Setup - Create admin account after all services are ready
  admin-setup:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: quiz_admin_setup
    restart: "no"
    depends_on:
      gateway-api:
        condition: service_healthy
      user-service-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Database configuration for MySQL
      DB_TYPE: mysql
      DB_HOST: quiz_mysql_gateway
      DB_PORT: 3306
      DB_USERNAME: gateway_user
      DB_PASSWORD: gateway_password
      DB_DATABASE: gateway_db
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      # API Gateway configuration
      USER_SERVICE_BASEURL: http://user-service-api:9005/api/v1
      USER_SERVICE_API_TOKEN: 45f65we46f5ew465few465we46fwe46f4ew65f46w5e4f65we4f65ew46few465f
    networks:
      - quiz_network
    command: ["node", "create-admin.js"]

# Named volumes for data persistence
volumes:
  mysql_gateway_data:
    driver: local
  mysql_question_data:
    driver: local
  # mongo_data removed since we use MongoDB Atlas

# Networks
networks:
  quiz_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
