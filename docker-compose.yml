    driver: local
  knowledge_chromadb_data:
    driver: local
  # mongo_data removed since we use MongoDB Atlas

# Networks
networks:
  quiz_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
