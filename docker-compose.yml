services:
  # MySQL Database for Gateway API
  quiz_mysql_gateway:
    image: mysql:8.0
    container_name: quiz_mysql_gateway
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gateway_db
      MYSQL_USER: gateway_user
      MYSQL_PASSWORD: gateway_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_gateway_data:/var/lib/mysql
      - ./mysql-init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent || exit 1"]
      timeout: 5s
      retries: 20
      interval: 3s
      start_period: 45s

  # MySQL Database for Question Service API
  quiz_mysql_question:
    image: mysql:8.0
    container_name: quiz_mysql_question
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: question_db
      MYSQL_USER: question_user
      MYSQL_PASSWORD: question_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_question_data:/var/lib/mysql
      - ./mysql-init/02-question-init.sql:/docker-entrypoint-initdb.d/02-question-init.sql
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent || exit 1"]
      timeout: 5s
      retries: 20
      interval: 3s
      start_period: 45s

  # MongoDB Atlas is used instead of local container
  # No local MongoDB needed since we use cloud MongoDB Atlas

  # Gateway API Service
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: quiz_gateway_api
    restart: unless-stopped
    depends_on:
      quiz_mysql_gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9008
      # Database configuration for MySQL
      DB_TYPE: mysql
      DB_HOST: quiz_mysql_gateway
      DB_PORT: 3306
      DB_USERNAME: gateway_user
      DB_PASSWORD: gateway_password
      DB_DATABASE: gateway_db
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      # JWT configuration
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 15m
