services:
  # MySQL Database for Gateway API
  mysql:
    image: mysql:8.0
    container_name: quiz_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gateway_db
      MYSQL_USER: gateway_user
      MYSQL_PASSWORD: gateway_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # MongoDB Atlas is used instead of local container
  # No local MongoDB needed since we use cloud MongoDB Atlas

  # Gateway API Service
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: quiz_gateway_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 9008
      # Database configuration for MySQL
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: gateway_user
      DB_PASSWORD: gateway_password
      DB_DATABASE: gateway_db
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      # JWT configuration
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 7
      # API Gateway configuration
      USER_SERVICE_BASEURL: http://service.vuquangduy.io.vn:9009
      USER_SERVICE_API_TOKEN: user_service_secret_token_2024
      # Production URL configuration
      API_BASE_URL: https://api.vuquangduy.io.vn
      FRONTEND_URL: https://api.vuquangduy.io.vn
      # Production domain for Swagger
      PRODUCTION_DOMAIN: api.vuquangduy.io.vn
    ports:
      - "9008:9008"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9008/"]
      timeout: 10s
      retries: 5
      start_period: 30s

  # User Service API
  user-service-api:
    build:
      context: ./user-service-api
      dockerfile: Dockerfile
    container_name: quiz_user_service_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 9009
      # MongoDB Atlas configuration
      MONGO_URI: mongodb+srv://vuduy050903_db_user:3qHHYv2yylxfhHyg@cluster0.icn9gah.mongodb.net/user_service?retryWrites=true&w=majority&appName=Cluster0
      # API configuration
      API_PREFIX: /api/v1
      API_TOKEN: user_service_secret_token_2024
    ports:
      - "9009:9009"
    # No longer depends on local MongoDB container
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9009/"]
      timeout: 10s
      retries: 5
      start_period: 30s

# Named volumes for data persistence
volumes:
  mysql_data:
    driver: local
  # mongo_data removed since we use MongoDB Atlas

# Networks
networks:
  quiz_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
