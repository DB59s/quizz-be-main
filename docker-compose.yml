services:
  # MySQL Database for Gateway API
  quiz_mysql_gateway:
    image: mysql:8.0
    container_name: quiz_mysql_gateway
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gateway_db
      MYSQL_USER: gateway_user
      MYSQL_PASSWORD: gateway_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_gateway_data:/var/lib/mysql
      - ./mysql-init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent || exit 1"]
      timeout: 5s
      retries: 20
      interval: 3s
      start_period: 45s

  # MySQL Database for Question Service API
  quiz_mysql_question:
    image: mysql:8.0
    container_name: quiz_mysql_question
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: question_db
      MYSQL_USER: question_user
      MYSQL_PASSWORD: question_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_question_data:/var/lib/mysql
      - ./mysql-init/02-question-init.sql:/docker-entrypoint-initdb.d/02-question-init.sql
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent || exit 1"]
      timeout: 5s
      retries: 20
      interval: 3s
      start_period: 45s

  # PostgreSQL Database for Quiz Service API
  quiz_postgres_quiz:
    image: postgres:15
    container_name: quiz_postgres_quiz
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_quiz_data:/var/lib/postgresql/data
      - ./postgres-init/03-quiz-init.sql:/docker-entrypoint-initdb.d/03-quiz-init.sql
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d quiz_db"]
      timeout: 5s
      retries: 20
      interval: 3s
      start_period: 45s

  # PostgreSQL Database for Submission Service API
  quiz_postgres_submission:
    image: postgres:15
    container_name: quiz_postgres_submission
    restart: unless-stopped
    environment:
      POSTGRES_USER: submission_user
      POSTGRES_PASSWORD: submission_password
      POSTGRES_DB: submission_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_submission_data:/var/lib/postgresql/data
      - ./postgres-init/04-submission-init.sql:/docker-entrypoint-initdb.d/04-submission-init.sql
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U submission_user -d submission_db"]
      timeout: 5s
      retries: 20
      interval: 3s
      start_period: 45s

  # PostgreSQL Database for Chatbot Service API
